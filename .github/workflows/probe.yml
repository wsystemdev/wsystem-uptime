name: probe
on:
  schedule: [{cron: '*/5 * * * *'}]
  workflow_dispatch: {}
permissions: {contents: write}
concurrency: probe
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe.py && python3 summarize.py
      - run: |
          git config user.name "W System probe"; git config user.email "probe@users.noreply.github.com"
          git add data && git commit -qm "probe" && git push -q || true
